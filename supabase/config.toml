# Supabase Edge Functions Configuration

# Disable JWT verification for cron-triggered functions
[functions.process-notifications]
verify_jwt = false

[functions.email-unread-messages]
verify_jwt = false

[functions.email-inactive-users]
verify_jwt = false

[functions.reviews-notify]
verify_jwt = false

[functions.onboarding-reminders]
verify_jwt = false

[functions.email-new-match]
verify_jwt = false

[functions.process-expired-bans]
verify_jwt = false

[functions.policy-restrict-straight-men]
verify_jwt = false

[functions.policy-restriction-reminder]
verify_jwt = false

[functions.policy-restriction-deactivate]
verify_jwt = false

# Notification triggers (called by database triggers via pg_net)
[functions.notify-new-like]
verify_jwt = false

[functions.notify-new-match]
verify_jwt = false

[functions.notify-new-message]
verify_jwt = false

# Resend webhook (called by Resend for bounce/spam/delivery events)
[functions.resend-webhook]
verify_jwt = false

# Win-back expired subscribers (daily cron)
[functions.winback-subscribers]
verify_jwt = false

# Photo moderation (called by cron retry + user uploads with internal auth check)
[functions.moderate-photo]
verify_jwt = false

# RevenueCat webhook (called by RevenueCat, which cannot send a Supabase JWT).
# MUST stay false: the CLI defaults to verify_jwt = true when a function is not
# declared here, so a deploy without this entry 401s every subscription event
# and silently stops all purchase/renewal/expiry syncing.
[functions.revenuecat-webhook]
verify_jwt = false

# Called by the app with the user's JWT (and by admin tooling with the service
# role). Gateway JWT verification MUST stay on. Declared explicitly because the
# CLI defaults verify_jwt to FALSE for any function not listed in this file — a
# deploy without this entry silently downgraded it from true to false
# (observed 2026-08-08). The function does validate the Authorization header
# itself, so this is defence-in-depth, but don't rely on that alone.
[functions.sync-subscription]
verify_jwt = true

# Weekly drift reconciliation against the RevenueCat API (cron-triggered).
[functions.reconcile-subscriptions]
verify_jwt = false
